name: Feature request
description: Propose a change in behavior or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Provider support questions belong here only after checking [provider support](https://github.com/akita0724/workers-workload-identity/blob/main/docs/reference/provider-support.mdx).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user or operator problem this solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Trust boundaries, claims, RPC shapes, public errors, discovery, JWKS, or key states affected.
