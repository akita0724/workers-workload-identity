name: Documentation
description: Report an error, gap, or translation mismatch in the documentation
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Path or URL of the page
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Japanese
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: If the documentation disagrees with the code, link the relevant source file.
    validations:
      required: true
